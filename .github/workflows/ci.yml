name: CI

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      # Vitest/contract-test/axe land in Days 10-12 (portfolio.md §15, §21) —
      # no `npm run test` script exists yet.

      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        name: Build and push
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker buildx build --platform linux/arm64 --target runtime \
            -t "$REGISTRY/portfolio:${{ github.sha }}" \
            -t "$REGISTRY/portfolio:latest" \
            --push \
            .

      # Days 5-9 (portfolio.md §15): infra's deploy.yml only triggers on
      # push-to-main touching docker-compose.yml/Caddyfile in that repo — a
      # bare image push here wouldn't otherwise redeploy anything. This
      # closes that gap (it predates ticker; likely why the Days 3-4 image
      # needed a manual workflow_dispatch to go live — see phase3.md).
      # Conditioned on the secret existing — deferred setup (INFRA_DISPATCH_TOKEN
      # not created yet) skips this cleanly instead of failing the run.
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push' && secrets.INFRA_DISPATCH_TOKEN != ''
        name: Trigger infra deploy
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          repository: ${{ github.repository_owner }}/infra
          event-type: image-pushed
