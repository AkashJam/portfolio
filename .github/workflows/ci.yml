name: CI

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # `secrets` isn't directly usable inside a step's `if:` condition
    # (GitHub Actions restriction) — expose it via job-level env instead, so
    # the "Trigger infra deploy" step below can check env.HAS_INFRA_TOKEN.
    env:
      HAS_INFRA_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      # build before typecheck (swapped from before Sentry landed): standalone
      # `next typegen` hangs once next.config.ts is wrapped with
      # withSentryConfig (reproduced directly — content-collections' codegen
      # never even starts, times out indefinitely), so `typecheck` (now just
      # `tsc --noEmit`, see package.json) relies on `build` having already
      # generated content-collections' virtual module and Next's route
      # types, rather than regenerating them itself via typegen.
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test

      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        name: Build and push
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          docker buildx build --platform linux/arm64 --target runtime \
            --progress=plain \
            --secret id=sentry_auth,env=SENTRY_AUTH_TOKEN \
            --build-arg NEXT_PUBLIC_SENTRY_DSN="${{ vars.NEXT_PUBLIC_SENTRY_DSN }}" \
            --build-arg SENTRY_RELEASE="${{ github.sha }}" \
            --build-arg NEXT_PUBLIC_SITE_URL="${{ vars.NEXT_PUBLIC_SITE_URL || 'https://akjames.dev' }}" \
            -t "$REGISTRY/portfolio:${{ github.sha }}" \
            -t "$REGISTRY/portfolio:latest" \
            --push \
            .

      # Days 5-9 (portfolio.md §15): infra's deploy.yml only triggers on
      # push-to-main touching docker-compose.yml/Caddyfile in that repo — a
      # bare image push here wouldn't otherwise redeploy anything. This
      # closes that gap (it predates ticker; likely why the Days 3-4 image
      # needed a manual workflow_dispatch to go live — see phase3.md).
      # Gated on the secret existing — and it deliberately doesn't. Dispatching
      # across repos needs a long-lived PAT with Contents:write on infra, which
      # is write access to infra's deploy.yml, which holds an SSM root shell on
      # the prod box (tag-scoped, no IAM/Terraform rights, but still the box and
      # its SSM SecureStrings). Not worth a standing credential to save a click
      # on a deploy done a few times a month, so this step stays skipped and
      # releases are run by hand: infra -> Actions -> Deploy -> Run workflow,
      # after this job has pushed the image. Creating INFRA_DISPATCH_TOKEN is
      # the only change needed to switch automatic deploys back on.
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push' && env.HAS_INFRA_TOKEN == 'true'
        name: Trigger infra deploy
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          repository: ${{ github.repository_owner }}/infra
          event-type: image-pushed

  # §21 "Contract"/"Accessibility"/"E2E" tiers — needs a live ticker + Redis
  # + Timescale, unlike the fast `build` job above. Gated the same way as
  # that job's own AWS/ECR steps (main-branch pushes only) — not on every
  # PR, avoiding both a full-stack spin-up on every commit and exercising
  # OIDC credentials from PR-triggered runs. NOTE (portfolio.md §15 Days
  # 10-12): written and locally verified against a real backend this same
  # way, but this exact job has not yet been run for real in GitHub Actions
  # — the arm64 `ticker` image executing under QEMU emulation on an x86
  # runner in particular is worth watching on the first real run.
  integration:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      timescale:
        image: timescale/timescaledb:2.20.3-pg16
        env:
          POSTGRES_USER: ticker
          POSTGRES_PASSWORD: ticker
          POSTGRES_DB: ticker
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TICKER_API_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # arm64 (matches ticker's own production target) run under QEMU
      # emulation, not built here — pulled from ECR, same image ticker's
      # own CI already pushed.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Configure AWS credentials
        id: creds
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # --network host: ticker's container needs to reach the redis/
      # timescale service containers via localhost — the same
      # sibling-container gotcha this project hit repeatedly in local dev
      # (see phase3.md), sidestepped here by not isolating ticker's network
      # namespace at all, same trick used to reach the same services above.
      #
      # --platform linux/arm64: without it, `docker run` matches the
      # runner's own host platform (amd64) against the image's manifest
      # list — ticker:latest has no amd64 entry at all (single-arch, built
      # for the arm64 production box only), so it fails with "no matching
      # manifest" before QEMU emulation (registered above) ever gets a
      # chance to run it. A real CI failure caught on the first live run,
      # not anticipated correctly here originally.
      - name: Run ticker migrate + serve
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker run --rm --network host --platform linux/arm64 \
            -e TIMESCALE_DSN="postgres://ticker:ticker@localhost:5432/ticker?sslmode=disable" \
            "$REGISTRY/ticker:latest" migrate

          docker run -d --network host --platform linux/arm64 --name ticker \
            -e SOURCE=sim -e ADDR=:8080 -e AGG_WINDOW=2s \
            -e TIMESCALE_DSN="postgres://ticker:ticker@localhost:5432/ticker?sslmode=disable" \
            -e REDIS_ADDR="localhost:6379" \
            "$REGISTRY/ticker:latest" serve

          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/ready && break
            sleep 2
          done

      - run: npm run test:contract

      - run: npx playwright install --with-deps chromium

      - run: npx playwright test

      - if: always()
        name: Ticker logs (on failure, for debugging)
        run: docker logs ticker || true
