name: CI

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      # Vitest/contract-test/axe land in Days 10-12 (portfolio.md §15, §21) —
      # no `npm run test` script exists yet.

      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        name: Debug OIDC token claims
        run: |
          IDTOKEN=$(curl -sSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "$IDTOKEN" | cut -d '.' -f2 | base64 -d 2>/dev/null | jq .

      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        name: Build and push
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build --target runtime \
            -t "$REGISTRY/portfolio:${{ github.sha }}" \
            -t "$REGISTRY/portfolio:latest" \
            .
          docker push "$REGISTRY/portfolio:${{ github.sha }}"
          docker push "$REGISTRY/portfolio:latest"
